name: Windows build (test)

# Manual trigger + on every push, so you can just click "Run workflow"
# from the Actions tab, or push a commit to see it run automatically.
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Installs a prebuilt Qt6 kit for MinGW, plus the matching MinGW
      # compiler toolchain itself, via aqtinstall.
      # NOTE: exact version/arch strings drift over time -- if this step
      # fails, check https://ddalcino.github.io/aqt-list-server/ for
      # currently-valid combinations and adjust 'version' / 'arch' / 'tools'.
      - name: Install Qt6 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310'
          set-env: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      # The project's CMakeLists.txt requires static libstdc++.a / libgcc.a /
      # libgcc_eh.a. Rather than trust `g++ -print-file-name` (which returned
      # a mangled/incomplete result last run and needs investigating), do a
      # real recursive filesystem search across the actual Qt MinGW install
      # so we know for certain what's actually shipped and where.
      - name: Locate static MinGW runtime libraries
        shell: pwsh
        run: |
          $mingwRoot = (Split-Path (Split-Path (Get-Command g++).Source))
          Write-Host "MinGW root: $mingwRoot"

          Write-Host "--- Full directory tree (first 200 entries) ---"
          Get-ChildItem -Recurse -Path $mingwRoot -ErrorAction SilentlyContinue |
            Select-Object -First 200 -ExpandProperty FullName

          Write-Host "--- Searching for libstdc++*.a, libgcc*.a anywhere under MinGW root ---"
          $found = Get-ChildItem -Recurse -Path $mingwRoot -ErrorAction SilentlyContinue -Include "libstdc++*.a","libgcc*.a"
          $found | ForEach-Object { Write-Host $_.FullName }

          $stdcxx = $found | Where-Object { $_.Name -eq "libstdc++.a" } | Select-Object -First 1
          $gcc    = $found | Where-Object { $_.Name -eq "libgcc.a" }    | Select-Object -First 1
          $gccEh  = $found | Where-Object { $_.Name -eq "libgcc_eh.a" } | Select-Object -First 1

          if (-not $stdcxx -or -not $gcc -or -not $gccEh) {
            Write-Warning "One or more static runtime archives were not found anywhere under $mingwRoot."
            Write-Warning "This likely means this MinGW distribution only ships the shared runtime (DLLs), not static archives."
            # Don't fail here -- let the facts above be visible in the log so we can decide the next step.
          } else {
            echo "PC6001VX_STATIC_STDCXX=$($stdcxx.FullName)" >> $env:GITHUB_ENV
            echo "PC6001VX_STATIC_GCC=$($gcc.FullName)" >> $env:GITHUB_ENV
            echo "PC6001VX_STATIC_GCC_EH=$($gccEh.FullName)" >> $env:GITHUB_ENV
          }

      - name: Configure (CMake)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNOAVI=ON
          -DNOSOUND=ON
          "-DPC6001VX_STATIC_STDCXX=${env:PC6001VX_STATIC_STDCXX}"
          "-DPC6001VX_STATIC_GCC=${env:PC6001VX_STATIC_GCC}"
          "-DPC6001VX_STATIC_GCC_EH=${env:PC6001VX_STATIC_GCC_EH}"
        shell: pwsh

      - name: Build
        run: ninja -C build PC6001VX

      - name: Bundle Qt DLLs (windeployqt)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "PC6001VX.exe" -Path build | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName -Destination dist\
          windeployqt --qmldir . dist\PC6001VX.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC6001VX-windows-test-build
          path: dist\
