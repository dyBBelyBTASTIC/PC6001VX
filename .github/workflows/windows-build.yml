name: Windows build (test)

# Manual trigger + on every push, so you can just click "Run workflow"
# from the Actions tab, or push a commit to see it run automatically.
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Installs a prebuilt Qt6 kit for MinGW, plus the matching MinGW
      # compiler toolchain itself, via aqtinstall.
      # NOTE: exact version/arch strings drift over time -- if this step
      # fails, check https://ddalcino.github.io/aqt-list-server/ for
      # currently-valid combinations and adjust 'version' / 'arch' / 'tools'.
      - name: Install Qt6 (MinGW)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310'
          set-env: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      # The project's CMakeLists.txt requires static libstdc++.a / libgcc.a /
      # libgcc_eh.a and looks for them at a hardcoded path under the MinGW
      # install that doesn't match every MinGW layout (e.g. Qt's own
      # tools_mingw package). Ask the compiler itself where its runtime
      # archives actually are -- this works regardless of layout -- and feed
      # the results in as pre-seeded cache variables so the project's
      # find_file(... REQUIRED) calls succeed without needing to patch it.
      - name: Locate static MinGW runtime libraries
        shell: pwsh
        run: |
          $stdcxx = (g++ -print-file-name=libstdc++.a).Trim()
          $gcc    = (g++ -print-file-name=libgcc.a).Trim()
          $gccEh  = (g++ -print-file-name=libgcc_eh.a).Trim()

          foreach ($pair in @(("libstdc++.a", $stdcxx), ("libgcc.a", $gcc), ("libgcc_eh.a", $gccEh))) {
            if (-not (Test-Path $pair[1])) {
              Write-Error "Could not locate $($pair[0]) via g++ -print-file-name (got: $($pair[1]))"
              exit 1
            }
          }

          echo "PC6001VX_STATIC_STDCXX=$stdcxx" >> $env:GITHUB_ENV
          echo "PC6001VX_STATIC_GCC=$gcc" >> $env:GITHUB_ENV
          echo "PC6001VX_STATIC_GCC_EH=$gccEh" >> $env:GITHUB_ENV

      - name: Configure (CMake)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNOAVI=ON
          -DNOSOUND=ON
          "-DPC6001VX_STATIC_STDCXX=${env:PC6001VX_STATIC_STDCXX}"
          "-DPC6001VX_STATIC_GCC=${env:PC6001VX_STATIC_GCC}"
          "-DPC6001VX_STATIC_GCC_EH=${env:PC6001VX_STATIC_GCC_EH}"
        shell: pwsh

      - name: Build
        run: ninja -C build PC6001VX

      - name: Bundle Qt DLLs (windeployqt)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "PC6001VX.exe" -Path build | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName -Destination dist\
          windeployqt --qmldir . dist\PC6001VX.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PC6001VX-windows-test-build
          path: dist\
